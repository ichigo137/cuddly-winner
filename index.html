<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>✨ Happy Birthday, Dear Sister ✨</title>
  <link rel="stylesheet" href="css/styles.css">
  <style>
    /* ===== PRELOADER ===== */
    #preloader {
      position: fixed; inset: 0;
      background: var(--midnight);
      z-index: 100000;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      transition: opacity 1s, visibility 1s;
    }
    #preloader.hidden { opacity: 0; visibility: hidden; pointer-events: none; }
    .preloader-heart { font-size: 80px; animation: pulse 1s ease-in-out infinite; }
    .preloader-text {
      font-family: 'Great Vibes', cursive;
      font-size: 28px; color: var(--gold-light);
      margin-top: 20px; animation: pulse 2s ease-in-out infinite;
    }

    /* ===== NAVIGATION ===== */
    #navbar {
      position: fixed; top: 0; left: 0; right: 0;
      z-index: 1000;
      display: flex; align-items: center; justify-content: center;
      gap: 6px; padding: 12px 15px;
      background: transparent;
      transition: all .5s;
      flex-wrap: wrap;
    }
    #navbar.scrolled {
      background: rgba(26,10,30,.92);
      backdrop-filter: blur(20px);
      padding: 8px 15px;
      box-shadow: 0 4px 30px rgba(232,160,191,.2);
    }
    #navbar a {
      color: var(--gold-light);
      text-decoration: none;
      font-family: 'Dancing Script', cursive;
      font-size: 15px;
      letter-spacing: 1px;
      padding: 6px 14px;
      border-radius: 20px;
      transition: all .3s;
      white-space: nowrap;
    }
    #navbar a:focus-visible {
      outline: 2px solid var(--gold);
      outline-offset: 2px;
    }
    #navbar a:hover, #navbar a.active {
      color: var(--midnight);
      background: var(--gold-light);
    }

    /* ===== HAMBURGER ===== */
    .hamburger {
      display: none; position: fixed;
      top: 12px; right: 12px; z-index: 1001;
      width: 42px; height: 42px;
      background: rgba(26,10,30,.9);
      border: 2px solid var(--gold);
      border-radius: 10px; cursor: pointer;
      flex-direction: column;
      align-items: center; justify-content: center; gap: 5px;
    }
    .hamburger:focus-visible {
      outline: 2px solid var(--gold);
      outline-offset: 2px;
    }
    .hamburger span { width: 20px; height: 2px; background: var(--gold); transition: all .3s; }

    /* ===== SKIP LINK ===== */
    .skip-link {
      position: fixed;
      top: -40px; left: 6px;
      background: var(--midnight);
      color: var(--gold-light);
      padding: 8px 16px;
      border-radius: 4px;
      z-index: 10000;
      text-decoration: none;
      font-family: 'Dancing Script', cursive;
      font-size: 14px;
      transition: top 0.3s, background 0.3s;
    }
    .skip-link:focus {
      top: 6px;
      background: var(--gold);
      color: var(--midnight);
    }

    /* ===== NAVIGATION SVG ICONS ===== */
    .nav-icon {
      width: 18px;
      height: 18px;
      display: block;
    }

    /* ===== PAGE FRAME ===== */
    #page-frame {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      border: none; width: 100%; height: 100%;
      z-index: 2;
      opacity: 0;
      transition: opacity .4s;
    }
    #page-frame.loaded { opacity: 1; }

    /* ===== FOOTER ===== */
    #main-footer {
      position: fixed; bottom: 0; left: 0; right: 0;
      z-index: 3; text-align: center;
      padding: 8px 20px;
      background: rgba(26,10,30,.8);
      backdrop-filter: blur(10px);
      border-top: 1px solid rgba(212,168,83,.1);
      pointer-events: none;
    }
    #main-footer p {
      font-family: 'Dancing Script', cursive;
      font-size: 13px; color: var(--gold-light); opacity: .5;
    }

    /* ===== RESPONSIVE ===== */
    @media (max-width: 900px) {
      .hamburger { display: flex; }
      #navbar {
        position: fixed; top: 0; right: -100%;
        width: 70%; height: 100vh;
        flex-direction: column; justify-content: center;
        gap: 15px; background: rgba(26,10,30,.97);
        transition: right .4s; padding: 60px 20px;
      }
      #navbar.open { right: 0; }
      #navbar a { font-size: 20px; padding: 10px 20px; }
    }

    /* ===== PREFERS-REDUCED-MOTION ===== */
    @media (prefers-reduced-motion: reduce) {
      #preloader { transition: none; }
      #preloader.hidden { transition: none; }
      .preloader-heart, .preloader-text { animation: none; }
      #navbar { transition: none; }
      .hamburger span { transition: none; }
      .skip-link { transition: none; }
      #page-frame { transition: none; }
    }
  </style>
</head>
<body>

    <symbol id="icon-playlist" viewBox="0 0 24 24"><path fill="currentColor" d="M12 7V3c-2.21 0-4 1.79-4 4v4H3v10h10V7h-1zM7 11h2v8H7v-8zm10-4v8h2v-8h-2z"/></symbol>
    <symbol id="icon-gallery" viewBox="0 0 24 24"><path fill="currentColor" d="M21 19V5c0-1.1-.9-2-2-2H5C3.9 3 3 3.9 3 5v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2zM8.5 13.5l2.5 3.01L14.5 12l4.5 6H5l3.5-4.5z"/></symbol>
    <symbol id="icon-close" viewBox="0 0 24 24"><path fill="currentColor" d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/></symbol>
  </svg>

  <!-- PRELOADER -->
  <div id="preloader">
    <div class="preloader-heart">💖</div>
    <div class="preloader-text">Preparing something special...</div>
  </div>

  <!-- HAMBURGER -->
  <div class="hamburger" id="hamburger" aria-label="Toggle menu" role="button" aria-controls="navbar" aria-expanded="false">
    <span></span><span></span><span></span>
  </div>

  <!-- SKIP LINK -->
  <a href="#page-frame" class="skip-link">Skip to main content</a>

  <!-- NAVIGATION -->
  <nav id="navbar">
    <a href="#" data-page="pages/home.html" class="active" aria-label="Home"><svg class="nav-icon"><use href="#icon-home"></use></svg></a>
    <a href="#" data-page="pages/cake.html" aria-label="Cake"><svg class="nav-icon"><use href="#icon-cake"></use></svg></a>
    <a href="#" data-page="pages/quiz.html" aria-label="Quiz"><svg class="nav-icon"><use href="#icon-brain"></use></svg></a>
    <a href="#" data-page="pages/games.html" aria-label="Games"><svg class="nav-icon"><use href="#icon-games"></use></svg></a>
    <a href="#" data-page="pages/wishes.html" aria-label="Wishes"><svg class="nav-icon"><use href="#icon-wishes"></use></svg></a>
    <a href="#" data-page="pages/fortune.html" aria-label="Fortune"><svg class="nav-icon"><use href="#icon-fortune"></use></svg></a>
    <a href="#" data-page="pages/playlist.html" aria-label="Playlist"><svg class="nav-icon"><use href="#icon-playlist"></use></svg></a>
    <a href="#" data-page="pages/slideshow.html" aria-label="Slideshow"><svg class="nav-icon"><use href="#icon-gallery"></use></svg></a>
    <a href="#" data-page="pages/gallery.html" aria-label="Gallery"><svg class="nav-icon"><use href="#icon-gallery"></use></svg></a>
  </nav>

  <!-- PAGE FRAME -->
  <iframe id="page-frame" src="pages/home.html"></iframe>

  <!-- FOOTER -->
  <div id="main-footer">
    <p>Made with 💖 for the most wonderful sister in the world</p>
  </div>

  <!-- SHARED ENGINE -->
  <script src="js/engine.js"></script>

  <!-- SHELL ROUTER -->
  <script>
    // ── Photo API URL ──
    // Leave empty for local dev (uses same-origin server.js).
    // Set to your Render Web Service URL for production.
    // Example: window.PHOTO_API_URL = 'https://birthday-photo-api.onrender.com';
    window.PHOTO_API_URL = '';

    const frame = document.getElementById('page-frame');
    const navLinks = document.querySelectorAll('#navbar a');
    const hamburger = document.getElementById('hamburger');
    const navbar = document.getElementById('navbar');

    // Preloader
    window.addEventListener('load', () => {
      setTimeout(() => document.getElementById('preloader').classList.add('hidden'), 2200);
    });

    // Hamburger toggle
    hamburger.addEventListener('click', () => {
      navbar.classList.toggle('open');
      hamburger.setAttribute('aria-expanded', navbar.classList.contains('open'));
    });

    // Keyboard support for hamburger (Enter key)
    hamburger.addEventListener('keydown', e => {
      if (e.key === 'Enter' || e.key === ' ') {
        e.preventDefault();
        navbar.classList.toggle('open');
        hamburger.setAttribute('aria-expanded', navbar.classList.contains('open'));
      }
    });

    // Close nav on link click (mobile)
    navLinks.forEach(link => {
      link.addEventListener('click', () => {
        navbar.classList.remove('open');
        hamburger.setAttribute('aria-expanded', 'false');
      });
    });

    // Page navigation
    function loadPage(url) {
      frame.classList.remove('loaded');
      setTimeout(() => {
        frame.src = url;
      }, 200);
    }

    frame.addEventListener('load', () => {
      frame.classList.add('loaded');
      // Re-init scroll reveal inside iframe
      try {
        const iframeDoc = frame.contentDocument || frame.contentWindow.document;
        iframeDoc.querySelectorAll('.reveal').forEach(el => {
          const observer = new IntersectionObserver((entries) => {
            entries.forEach((entry, i) => {
              if (entry.isIntersecting) {
                setTimeout(() => entry.target.classList.add('visible'), i * 100);
                observer.unobserve(entry.target);
              }
            });
          }, { threshold: 0.15, rootMargin: '0px 0px -50px 0px' });
          observer.observe(el);
        });
      } catch (e) { /* cross-origin */ }
    });

    navLinks.forEach(link => {
      link.addEventListener('click', e => {
        e.preventDefault();
        const page = link.dataset.page;
        navLinks.forEach(l => l.classList.remove('active'));
        link.classList.add('active');
        loadPage(page);
        history.pushState(null, '', '#' + page.split('/').pop().replace('.html', ''));
      });
    });

    // Scroll effect for navbar
    frame.addEventListener('scroll', () => {
      try {
        const scrollY = frame.contentWindow.scrollY;
        navbar.classList.toggle('scrolled', scrollY > 50);
      } catch (e) {}
    });

    // Hash routing on load
    const hash = location.hash.slice(1);
    if (hash) {
      const pageMap = {
        home: 'pages/home.html', cake: 'pages/cake.html', quiz: 'pages/quiz.html',
        games: 'pages/games.html', wishes: 'pages/wishes.html', fortune: 'pages/fortune.html',
        playlist: 'pages/playlist.html', slideshow: 'pages/slideshow.html',
        gallery: 'pages/gallery.html'
      };
      if (pageMap[hash]) {
        navLinks.forEach(l => {
          l.classList.toggle('active', l.dataset.page === pageMap[hash]);
        });
        frame.src = pageMap[hash];
      }
    }
  </script>
</body>
</html>
