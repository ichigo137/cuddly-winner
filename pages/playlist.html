<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Birthday Playlist</title>
  <link rel="stylesheet" href="../css/styles.css">
  <style>
    body { background: var(--midnight); }
    .playlist-page { padding: 100px 20px 60px; max-width: 650px; margin: 0 auto; }

    .viz-box {
      width: 100%; height: 100px;
      background: linear-gradient(145deg, rgba(255,255,255,.03), rgba(255,255,255,.01));
      border: 1px solid rgba(212,168,83,.15); border-radius: 16px;
      margin-bottom: 30px; overflow: hidden;
    }
    #vizCanvas { width: 100%; height: 100%; display: block; }

    .now-playing {
      text-align: center; margin-bottom: 20px; min-height: 24px;
    }
    .now-playing .np-title {
      font-family: 'Playfair Display', serif; font-size: 20px; color: var(--gold-light);
    }
    .now-playing .np-artist {
      font-family: 'Dancing Script', cursive; font-size: 16px; color: var(--lavender); margin-top: 4px;
    }

    .progress-bar {
      width: 100%; height: 4px; background: rgba(255,255,255,.1); border-radius: 2px;
      margin-bottom: 20px; cursor: pointer; position: relative;
    }
    .progress-fill {
      height: 100%; background: linear-gradient(90deg, var(--rose-deep), var(--gold));
      border-radius: 2px; width: 0%; transition: width .1s linear;
    }
    .progress-time {
      display: flex; justify-content: space-between; font-size: 12px;
      color: rgba(252,228,236,.5); margin-bottom: 16px;
    }

    .player-controls {
      display: flex; align-items: center; justify-content: center; gap: 20px; margin-bottom: 30px;
    }
    .ctrl-btn {
      width: 44px; height: 44px; border-radius: 50%; border: 1px solid rgba(212,168,83,.3);
      background: rgba(26,10,30,.6); color: var(--gold-light); font-size: 18px;
      cursor: pointer; display: flex; align-items: center; justify-content: center;
      transition: all .3s; backdrop-filter: blur(8px);
    }
    .ctrl-btn:hover { background: var(--gold); color: var(--midnight); border-color: var(--gold); }
    .ctrl-btn.play-btn { width: 56px; height: 56px; font-size: 22px; }

    .pl-item {
      display: flex; align-items: center; gap: 16px;
      padding: 14px 18px;
      background: linear-gradient(145deg, rgba(255,255,255,.05), rgba(255,255,255,.02));
      border: 1px solid rgba(212,168,83,.1); border-radius: 14px;
      margin-bottom: 10px; cursor: pointer; transition: all .3s;
    }
    .pl-item:hover { border-color: var(--gold); background: rgba(212,168,83,.08); transform: translateX(5px); }
    .pl-item.playing { border-color: var(--rose); background: rgba(232,160,191,.08); }
    .pl-num { font-family: 'Dancing Script', cursive; font-size: 18px; color: var(--gold); min-width: 28px; text-align: center; }
    .pl-info { flex: 1; }
    .pl-info h4 { font-family: 'Playfair Display', serif; font-size: 16px; color: var(--gold-light); }
    .pl-info p { font-size: 13px; color: rgba(252,228,236,.5); margin-top: 2px; }
    .pl-duration { font-size: 13px; color: rgba(252,228,236,.4); font-family: 'Dancing Script', cursive; }
    .pl-eq { display: flex; gap: 3px; align-items: flex-end; height: 18px; }
    .pl-eq span { width: 3px; background: var(--rose); border-radius: 2px; height: 4px; }
    .pl-item.playing .pl-eq span { animation: eqBounce 1s ease-in-out infinite; }
    .pl-eq span:nth-child(1) { animation-delay: 0s; }
    .pl-eq span:nth-child(2) { animation-delay: .15s; }
    .pl-eq span:nth-child(3) { animation-delay: .3s; }
    .pl-eq span:nth-child(4) { animation-delay: .45s; }
    @keyframes eqBounce { 0%,100%{transform:scaleY(1)} 50%{transform:scaleY(.3)} }

    .pl-item.no-audio { opacity: .5; cursor: default; }
    .pl-item.no-audio:hover { transform: none; }

    .playlist-note { text-align: center; font-family: 'Dancing Script', cursive; color: var(--lavender); margin-top: 24px; font-size: 15px; line-height: 1.8; }
    .playlist-note a { color: var(--gold-light); }

    @media (prefers-reduced-motion: reduce) {
      .pl-item.playing .pl-eq span { animation: none !important; }
    }
  </style>
</head>
<body>
  <div class="playlist-page">
    <div class="section-header">
      <div class="ornament">✦ ✦ ✦</div>
      <h2>Birthday Playlist</h2>
      <p>Songs to celebrate your special day</p>
    </div>

    <div class="viz-box"><canvas id="vizCanvas"></canvas></div>

    <div class="now-playing" id="nowPlaying"></div>
    <div class="progress-bar" id="progressBar"><div class="progress-fill" id="progressFill"></div></div>
    <div class="progress-time"><span id="timeCurrent">0:00</span><span id="timeTotal">0:00</span></div>

    <div class="player-controls">
      <button class="ctrl-btn" id="prevBtn" aria-label="Previous song">⏮</button>
      <button class="ctrl-btn play-btn" id="playBtn" aria-label="Play / Pause">▶</button>
      <button class="ctrl-btn" id="nextBtn" aria-label="Next song">⏭</button>
    </div>

    <div id="plItems"></div>

    <p class="playlist-note">
      🎵 Paste your audio links below and they'll play here!<br>
      Free hosting: <a href="https://sndup.net" target="_blank">SndUp</a> ·
      <a href="https://www.soundcloud.com" target="_blank">SoundCloud</a> ·
      <a href="https://archive.org" target="_blank">Archive.org</a> ·
      <a href="https://cloudinary.com" target="_blank">Cloudinary</a>
    </p>
  </div>

  <script src="../js/engine.js"></script>
  <script>
    // ══════════════════════════════════════════════════
    //  PASTE DIRECT AUDIO LINKS BELOW (must end in .mp3, .wav, .ogg, etc.)
    //  Free hosting options:
    //    • sndup.net        — upload MP3, get instant direct link
    //    • soundcloud.com   — upload, enable download, copy track URL
    //    • archive.org      — upload to "uploads" section, get direct file URL
    //    • cloudinary.com   — upload audio, use delivery URL
    //    • GitHub repo      — push .mp3 files, use raw.githubusercontent.com URL
    // ══════════════════════════════════════════════════
    const songs = [
      { title: 'Happy Birthday', artist: 'Traditional', color: '#ff6b6b', src: 'https://zkhmdpknqcylwyqqmtcp.supabase.co/storage/v1/object/sign/photos/OIIAOIIA%20CAT%20Happy%20Birthday%20to%20You%20_%20Spinning%20Cat%20Uia%20Meme(MP3_320K).mp3?token=eyJraWQiOiI5MDUzOThhNi1jYTg4LTRhMjItYmMxNS01MWNkZjg0NjdhZTAiLCJhbGciOiJIUzUxMiJ9.eyJ1cmwiOiJwaG90b3MvT0lJQU9JSUEgQ0FUIEhhcHB5IEJpcnRoZGF5IHRvIFlvdSBfIFNwaW5uaW5nIENhdCBVaWEgTWVtZShNUDNfMzIwSykubXAzIiwic2NvcGUiOiJkb3dubG9hZCIsImlhdCI6MTc4ODQ2ODE1OCwiZXhwIjoxODc0NzgxNzU4fQ.NWsn-KLbR9oq_UdN3LYAYlzo-0HupzaYGKkLr3aSDKtttbINNa0ETlGnL3sREGhodzsCvJcp9znG2untV-KzIw' },
      { title: 'Birthday', artist: 'The Beatles', color: '#feca57', src: '' },
      { title: 'In My Life', artist: 'The Beatles', color: '#48dbfb', src: '' },
      { title: 'Lean on Me', artist: 'Bill Withers', color: '#ff9ff3', src: '' },
      { title: 'What a Wonderful World', artist: 'Louis Armstrong', color: '#54a0ff', src: '' },
      { title: 'You Are the Sunshine of My Life', artist: 'Stevie Wonder', color: '#f368e0', src: '' },
      { title: 'Count on Me', artist: 'Bruno Mars', color: '#01a3a4', src: '' },
      { title: 'Best Day of My Life', artist: 'American Authors', color: '#5f27cd', src: '' },
    ];

    // ── Audio engine ──
    const audio = new Audio();
    audio.preload = 'metadata';
    let currentIdx = -1;
    let isPlaying = false;
    let vizAF = null;
    let vizColor = '#ff6b6b';

    const playBtn = document.getElementById('playBtn');
    const prevBtn = document.getElementById('prevBtn');
    const nextBtn = document.getElementById('nextBtn');
    const nowPlaying = document.getElementById('nowPlaying');
    const progressFill = document.getElementById('progressFill');
    const progressBar = document.getElementById('progressBar');
    const timeCurrent = document.getElementById('timeCurrent');
    const timeTotal = document.getElementById('timeTotal');
    const container = document.getElementById('plItems');

    function fmt(s) { const m = Math.floor(s / 60); return m + ':' + String(Math.floor(s % 60)).padStart(2, '0'); }

    function playSong(idx) {
      if (idx < 0 || idx >= songs.length) return;
      const song = songs[idx];
      if (!song.src) return; // skip songs without audio
      currentIdx = idx;
      audio.src = song.src;
      audio.play().catch(() => {});
      isPlaying = true;
      playBtn.textContent = '⏸';
      vizColor = song.color;
      nowPlaying.innerHTML = `<div class="np-title">${song.title}</div><div class="np-artist">${song.artist}</div>`;
      document.querySelectorAll('.pl-item').forEach((el, i) => el.classList.toggle('playing', i === idx));
      startViz(song.color);
    }

    function togglePlay() {
      if (currentIdx < 0) { // nothing selected — play first with audio
        const first = songs.findIndex(s => s.src);
        if (first >= 0) playSong(first);
        return;
      }
      if (isPlaying) { audio.pause(); isPlaying = false; playBtn.textContent = '▶'; }
      else { audio.play().catch(() => {}); isPlaying = true; playBtn.textContent = '⏸'; }
    }

    function playNext() {
      let next = currentIdx + 1;
      while (next < songs.length && !songs[next].src) next++;
      if (next < songs.length) playSong(next);
      else { // wrap around
        next = 0;
        while (next < songs.length && !songs[next].src) next++;
        if (next < songs.length) playSong(next);
      }
    }

    function playPrev() {
      let prev = currentIdx - 1;
      while (prev >= 0 && !songs[prev].src) prev--;
      if (prev >= 0) playSong(prev);
      else {
        prev = songs.length - 1;
        while (prev >= 0 && !songs[prev].src) prev--;
        if (prev >= 0) playSong(prev);
      }
    }

    playBtn.addEventListener('click', togglePlay);
    nextBtn.addEventListener('click', playNext);
    prevBtn.addEventListener('click', playPrev);

    // ── Progress bar ──
    audio.addEventListener('timeupdate', () => {
      if (audio.duration) {
        progressFill.style.width = (audio.currentTime / audio.duration * 100) + '%';
        timeCurrent.textContent = fmt(audio.currentTime);
        timeTotal.textContent = fmt(audio.duration);
      }
    });
    audio.addEventListener('ended', playNext);

    progressBar.addEventListener('click', e => {
      if (audio.duration) {
        const rect = progressBar.getBoundingClientRect();
        audio.currentTime = ((e.clientX - rect.left) / rect.width) * audio.duration;
      }
    });

    // ── Build song list ──
    songs.forEach((song, i) => {
      const item = document.createElement('div');
      const hasAudio = !!song.src;
      item.className = 'pl-item' + (hasAudio ? '' : ' no-audio');
      item.innerHTML = `
        <div class="pl-num">${i + 1}</div>
        <div class="pl-info"><h4>${song.title}</h4><p>${song.artist}</p></div>
        <div class="pl-eq"><span></span><span></span><span></span><span></span></div>`;
      if (hasAudio) {
        item.tabIndex = 0;
        item.setAttribute('role', 'button');
        item.setAttribute('aria-label', `Play "${song.title}" by ${song.artist}`);
        item.addEventListener('click', () => playSong(i));
        item.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); playSong(i); } });
      }
      container.appendChild(item);
    });

    // ── Visualizer ──
    function startViz(color) {
      const canvas = document.getElementById('vizCanvas');
      const ctx = canvas.getContext('2d');
      canvas.width = canvas.parentElement.clientWidth;
      canvas.height = 100;
      if (vizAF) cancelAnimationFrame(vizAF);
      const bars = 40;
      function draw() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        const barW = canvas.width / bars - 2;
        for (let i = 0; i < bars; i++) {
          const h = isPlaying ? (Math.random() * 80 + 10) : (10 + Math.sin(Date.now() * 0.002 + i) * 5);
          ctx.fillStyle = color;
          ctx.globalAlpha = .5 + Math.random() * .5;
          ctx.fillRect(i * (barW + 2), canvas.height - h, barW, h);
          ctx.beginPath();
          ctx.arc(i * (barW + 2) + barW / 2, canvas.height - h, barW / 2, 0, Math.PI * 2);
          ctx.fill();
        }
        ctx.globalAlpha = 1;
        vizAF = requestAnimationFrame(draw);
      }
      draw();
    }

    // Start idle visualizer
    startViz('#ff6b6b');
  </script>
</body>
</html>
