<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Photo Slideshow</title>
  <link rel="stylesheet" href="../css/styles.css">
  <style>
    body { background: var(--midnight); }
    .slideshow-page { padding: 100px 20px 60px; max-width: 800px; margin: 0 auto; text-align: center; }

    .slide-frame {
      width: 100%; aspect-ratio: 4/3; border-radius: 20px; overflow: hidden;
      position: relative; border: 2px solid rgba(212,168,83,.3); margin-bottom: 20px;
    }
    .slide {
      position: absolute; inset: 0;
      display: flex; align-items: center; justify-content: center; flex-direction: column;
      opacity: 0; transition: opacity .8s; font-size: 80px;
    }
    .slide.active { opacity: 1; }
    .slide:nth-child(1) { background: linear-gradient(135deg, rgba(232,160,191,.2), rgba(201,177,255,.15)); }
    .slide:nth-child(2) { background: linear-gradient(135deg, rgba(212,168,83,.2), rgba(232,160,191,.15)); }
    .slide:nth-child(3) { background: linear-gradient(135deg, rgba(201,177,255,.2), rgba(248,187,208,.15)); }
    .slide:nth-child(4) { background: linear-gradient(135deg, rgba(248,187,208,.2), rgba(212,168,83,.15)); }
    .slide:nth-child(5) { background: linear-gradient(135deg, rgba(107,33,66,.2), rgba(232,160,191,.15)); }
    .slide-caption { font-family: 'Dancing Script', cursive; font-size: 22px; color: var(--gold-light); margin-top: 15px; }
    .slide-label { font-size: 14px; color: var(--blush); margin-top: 5px; }

    .slide-controls { display: flex; gap: 15px; justify-content: center; align-items: center; }
    .slide-btn {
      width: 50px; height: 50px; border-radius: 50%;
      background: linear-gradient(135deg, var(--rose-deep), var(--gold));
      border: none; color: #fff; font-size: 20px; cursor: pointer;
      transition: all .3s; display: flex; align-items: center; justify-content: center;
    }
    .slide-btn:hover { transform: scale(1.1); box-shadow: 0 8px 25px rgba(201,75,124,.4); }
    .slide-counter { font-family: 'Dancing Script', cursive; font-size: 18px; color: var(--gold-light); }
    .slide-dots { display: flex; gap: 8px; justify-content: center; margin-top: 15px; }
    .slide-dot {
      width: 10px; height: 10px; border-radius: 50%;
      background: rgba(255,255,255,.2); cursor: pointer; transition: all .3s;
    }
    .slide-dot.active { background: var(--gold); transform: scale(1.3); }
  </style>
</head>
<body>
  <div class="slideshow-page">
    <div class="section-header">
      <div class="ornament">✦ ✦ ✦</div>
      <h2>Photo Slideshow</h2>
      <p>A journey through our memories</p>
    </div>

    <div class="slide-frame" id="slideFrame">
      <div class="slide active" style="font-size:80px;">📸<div class="slide-caption">Childhood Adventures</div><div class="slide-label">Replace with your photo</div></div>
      <div class="slide" style="font-size:80px;">🎂<div class="slide-caption">Birthday Celebrations</div><div class="slide-label">Replace with your photo</div></div>
      <div class="slide" style="font-size:80px;">🎉<div class="slide-caption">Party Nights</div><div class="slide-label">Replace with your photo</div></div>
      <div class="slide" style="font-size:80px;">💕<div class="slide-caption">Sister Moments</div><div class="slide-label">Replace with your photo</div></div>
      <div class="slide" style="font-size:80px;">🌟<div class="slide-caption">Making Memories</div><div class="slide-label">Replace with your photo</div></div>
    </div>

    <div class="slide-controls">
      <button class="slide-btn" onclick="prevSlide()">◀</button>
      <span class="slide-counter" id="slideCounter">1 / 5</span>
      <button class="slide-btn" onclick="nextSlide()">▶</button>
    </div>
    <div class="slide-dots" id="slideDots"></div>
    <button class="gold-btn" style="margin-top:20px;" id="autoBtn" onclick="toggleAuto()">▶ Auto Play</button>
  </div>

  <script>
    const slides = document.querySelectorAll('.slide');
    let idx = 0, autoInt = null;

    function goTo(i) {
      idx = i;
      slides.forEach((s, j) => s.classList.toggle('active', j === i));
      document.querySelectorAll('.slide-dot').forEach((d, j) => d.classList.toggle('active', j === i));
      document.getElementById('slideCounter').textContent = `${i + 1} / ${slides.length}`;
    }
    function nextSlide() { goTo((idx + 1) % slides.length); }
    function prevSlide() { goTo((idx - 1 + slides.length) % slides.length); }
    function toggleAuto() {
      if (autoInt) { clearInterval(autoInt); autoInt = null; document.getElementById('autoBtn').textContent = '▶ Auto Play'; }
      else { autoInt = setInterval(nextSlide, 3000); document.getElementById('autoBtn').textContent = '⏸ Pause'; }
    }

    // Dots
    const dotsContainer = document.getElementById('slideDots');
    slides.forEach((_, i) => {
      const dot = document.createElement('div');
      dot.className = 'slide-dot' + (i === 0 ? ' active' : '');
      dot.onclick = () => goTo(i);
      dotsContainer.appendChild(dot);
    });
  </script>
</body>
</html>
