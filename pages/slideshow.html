<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Photo Slideshow</title>
  <link rel="stylesheet" href="../css/styles.css">
  <style>
    body { background: var(--midnight); }
    .slideshow-page { padding: 100px 20px 60px; max-width: 800px; margin: 0 auto; text-align: center; }

    .slide-frame {
      width: 100%; aspect-ratio: 4/3; border-radius: 20px; overflow: hidden;
      position: relative; border: 2px solid rgba(212,168,83,.3); margin-bottom: 20px;
    }
    .slide {
      position: absolute; inset: 0;
      display: flex; align-items: center; justify-content: center; flex-direction: column;
      opacity: 0; transition: opacity .8s;
      background: linear-gradient(135deg, rgba(232,160,191,.1), rgba(201,177,255,.08));
    }
    .slide.active { opacity: 1; }
    .slide img {
      width: 100%; height: 100%; object-fit: cover;
      position: absolute; inset: 0;
    }
    .slide-caption {
      display: none;
    }
    .slide-label { font-size: 14px; color: var(--blush); margin-top: 5px; position: relative; z-index: 2; }

    /* Loading / empty states */
    .slide-loading {
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      height: 100%; gap: 15px; color: var(--gold-light); font-family: 'Dancing Script', cursive;
    }
    .slide-loading .spinner {
      width: 30px; height: 30px; border: 3px solid rgba(212,168,83,.2);
      border-top-color: var(--gold); border-radius: 50%;
      animation: spin .8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .slide-empty {
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      height: 100%; gap: 10px; color: var(--lavender);
    }
    .slide-empty .empty-icon { font-size: 60px; }
    .slide-empty .empty-text { font-family: 'Dancing Script', cursive; font-size: 20px; }

    .slide-controls { display: flex; gap: 15px; justify-content: center; align-items: center; }
    .slide-btn {
      width: 50px; height: 50px; border-radius: 50%;
      background: linear-gradient(135deg, var(--rose-deep), var(--gold));
      border: none; color: #fff; font-size: 20px; cursor: pointer;
      transition: all .3s; display: flex; align-items: center; justify-content: center;
    }
    .slide-btn:hover { transform: scale(1.1); box-shadow: 0 8px 25px rgba(201,75,124,.4); }
    .slide-counter { font-family: 'Dancing Script', cursive; font-size: 18px; color: var(--gold-light); }
    .slide-dots { display: flex; gap: 8px; justify-content: center; margin-top: 15px; }
    .slide-dot {
      width: 10px; height: 10px; border-radius: 50%;
      background: rgba(255,255,255,.2); cursor: pointer; transition: all .3s;
    }
    .slide-dot.active { background: var(--gold); transform: scale(1.3); }

    @media (prefers-reduced-motion: reduce) {
      .slide { transition: none !important; }
      .slide-btn:hover { transform: none !important; }
      .slide-dot.active { transform: none !important; }
      .slide-loading .spinner { animation: none !important; }
    }
  </style>
</head>
<body>
  <div class="slideshow-page">
    <div class="section-header">
      <div class="ornament">✦ ✦ ✦</div>
      <h2>Photo Slideshow</h2>
      <p>A journey through our memories</p>
    </div>

    <div class="slide-frame" id="slideFrame">
      <!-- Loading state -->
      <div class="slide-loading" id="slideLoading">
        <div class="spinner"></div>
        <div>Loading photos...</div>
      </div>
    </div>

    <div class="slide-controls" id="slideControls" style="display:none;">
      <button class="slide-btn" onclick="prevSlide()" aria-label="Previous slide">◀</button>
      <span class="slide-counter" id="slideCounter">1 / 1</span>
      <button class="slide-btn" onclick="nextSlide()" aria-label="Next slide">▶</button>
    </div>
    <div class="slide-dots" id="slideDots"></div>
    <button class="gold-btn" style="margin-top:20px;" id="autoBtn" onclick="toggleAuto()" aria-label="Toggle autoplay">▶ Auto Play</button>
  </div>

  <script src="../js/engine.js"></script>
  <script>
    const frame = document.getElementById('slideFrame');
    const loadingEl = document.getElementById('slideLoading');
    const controlsEl = document.getElementById('slideControls');
    const dotsEl = document.getElementById('slideDots');
    const counterEl = document.getElementById('slideCounter');

    let slides = [];
    let idx = 0;
    let autoInt = null;

    function goTo(i) {
      if (slides.length === 0) return;
      idx = (i + slides.length) % slides.length;
      document.querySelectorAll('.slide').forEach((s, j) => s.classList.toggle('active', j === idx));
      document.querySelectorAll('.slide-dot').forEach((d, j) => d.classList.toggle('active', j === idx));
      counterEl.textContent = `${idx + 1} / ${slides.length}`;
    }

    function nextSlide() { goTo(idx + 1); }
    function prevSlide() { goTo(idx - 1); }

    function toggleAuto() {
      if (autoInt) {
        clearInterval(autoInt); autoInt = null;
        document.getElementById('autoBtn').textContent = '▶ Auto Play';
      } else {
        autoInt = setInterval(nextSlide, 3000);
        document.getElementById('autoBtn').textContent = '⏸ Pause';
      }
    }

    function renderSlides(photos) {
      // Remove loading indicator
      if (loadingEl) loadingEl.remove();

      if (photos.length === 0) {
        frame.innerHTML = `
          <div class="slide-empty">
            <div class="empty-icon">📸</div>
            <div class="empty-text">No photos uploaded yet</div>
            <div style="font-size:14px;color:var(--blush);">Upload photos to your Supabase Storage bucket to see them here.</div>
          </div>`;
        return;
      }

      // Create slide elements
      const fragment = document.createDocumentFragment();
      photos.forEach((photo, i) => {
        const slide = document.createElement('div');
        slide.className = 'slide' + (i === 0 ? ' active' : '');
        slide.innerHTML = `
          <img src="${photo.url}" alt="${photo.caption}" loading="${i < 2 ? 'eager' : 'lazy'}">
          <div class="slide-caption">${photo.caption}</div>`;
        fragment.appendChild(slide);
      });
      frame.appendChild(fragment);

      // Create dots
      photos.forEach((_, i) => {
        const dot = document.createElement('div');
        dot.className = 'slide-dot' + (i === 0 ? ' active' : '');
        dot.tabIndex = 0;
        dot.setAttribute('role', 'button');
        dot.setAttribute('aria-label', `Go to slide ${i + 1}`);
        dot.onclick = () => goTo(i);
        dot.addEventListener('keydown', e => {
          if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); goTo(i); }
        });
        dotsEl.appendChild(dot);
      });

      // Show controls
      controlsEl.style.display = '';
      counterEl.textContent = `1 / ${photos.length}`;
    }

    // ── Determine API base URL ──
    // Local dev: same origin (server.js serves both static + API)
    // Production: separate Render Web Service URL set in parent index.html
    function getApiBaseUrl() {
      // Check if parent window has a configured API URL (production)
      try {
        const parentUrl = parent.window.PHOTO_API_URL;
        if (parentUrl) return parentUrl;
      } catch (e) { /* cross-origin or not in iframe */ }
      // Fallback: same origin (local dev with server.js)
      return window.location.protocol + '//' + window.location.host;
    }

    // ── Fetch photos from backend API ──
    async function loadPhotos() {
      try {
        const apiBase = getApiBaseUrl();
        const res = await fetch(apiBase + '/api/photos');
        console.log('[Slideshow] API base:', apiBase);

        console.log('[Slideshow] Response status:', res.status);

        if (!res.ok) {
          const errorData = await res.json().catch(() => ({}));
          const detail = errorData.details || errorData.error || `HTTP ${res.status}`;
          console.error('[Slideshow] API error:', detail);
          throw new Error(detail);
        }

        const data = await res.json();
        console.log('[Slideshow] Photos received:', (data.photos || []).length);
        slides = data.photos || [];
        renderSlides(slides);
      } catch (err) {
        console.error('[Slideshow] Failed to load photos:', err);
        if (loadingEl) loadingEl.remove();
        frame.innerHTML = `
          <div class="slide-empty">
            <div class="empty-icon">⚠️</div>
            <div class="empty-text">Could not load photos</div>
            <div style="font-size:14px;color:var(--blush);margin:5px 0;">${err.message || 'Unknown error'}</div>
            <button class="gold-btn" style="margin-top:15px;font-size:14px;padding:8px 20px;" onclick="location.reload()">🔄 Retry</button>
          </div>`;
      }
    }

    loadPhotos();
  </script>
</body>
</html>
