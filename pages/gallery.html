<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Photo Gallery</title>
  <link rel="stylesheet" href="../css/styles.css">
  <style>
    body { background: var(--midnight); }
    .gallery-page { padding: 100px 20px 60px; max-width: 1200px; margin: 0 auto; }

    .gallery-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
      gap: 30px;
    }

    .gallery-item {
      position: relative;
      border-radius: 20px;
      overflow: hidden;
      border: 1px solid rgba(212,168,83,.2);
      background: linear-gradient(145deg, rgba(255,255,255,.06), rgba(255,255,255,.02));
      transition: all .5s cubic-bezier(.23,1,.32,1);
      aspect-ratio: 4/3;
    }
    .gallery-item:hover {
      transform: translateY(-8px);
      border-color: var(--gold);
      box-shadow: 0 20px 60px rgba(212,168,83,.2);
    }
    .gallery-item img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }
    .gallery-item .placeholder {
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 10px;
      color: var(--lavender);
    }
    .gallery-item .placeholder .icon { font-size: 50px; }
    .gallery-item .placeholder .text {
      font-family: 'Dancing Script', cursive;
      font-size: 16px;
    }
    .gallery-item .caption {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      padding: 15px;
      background: linear-gradient(transparent, rgba(26,10,30,.9));
      font-family: 'Dancing Script', cursive;
      font-size: 18px;
      color: var(--gold-light);
      text-align: center;
    }

    .gallery-note {
      text-align: center;
      font-family: 'Dancing Script', cursive;
      color: var(--lavender);
      margin-top: 40px;
      font-size: 16px;
    }

    @media (max-width: 768px) {
      .gallery-grid { grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 20px; }
    }
    @media (max-width: 480px) {
      .gallery-grid { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <div class="gallery-page">
    <div class="section-header">
      <div class="ornament">✦ ✦ ✦</div>
      <h2>Photo Gallery</h2>
      <p>Memories captured in time</p>
    </div>

    <div class="gallery-grid" id="galleryGrid"></div>
    <p class="gallery-note">✨ A picture is worth a thousand words ✨</p>
  </div>

  <script src="../js/engine.js"></script>
  <script>
    // ══════════════════════════════════════════════════════
    //  REPLACE THE URLs BELOW WITH YOUR IMAGEBB IMAGE URLS
    //  Upload images at https://imgbb.com and paste the
    //  "Direct link" URL for each image.
    // ══════════════════════════════════════════════════════
    const photos = [
      { url: '', caption: 'Memory 1' },
      { url: '', caption: 'Memory 2' },
      { url: '', caption: 'Memory 3' },
      { url: '', caption: 'Memory 4' },
      { url: '', caption: 'Memory 5' },
      { url: '', caption: 'Memory 6' },
      { url: '', caption: 'Memory 7' },
      { url: '', caption: 'Memory 8' },
      { url: '', caption: 'Memory 9' },
      { url: '', caption: 'Memory 10' },
    ];

    const grid = document.getElementById('galleryGrid');
    photos.forEach((photo, i) => {
      const item = document.createElement('div');
      item.className = 'gallery-item reveal';
      if (photo.url) {
        item.innerHTML = `
          <img src="${photo.url}" alt="${photo.caption}" loading="${i < 3 ? 'eager' : 'lazy'}">
          <div class="caption">${photo.caption}</div>`;
      } else {
        item.innerHTML = `
          <div class="placeholder">
            <div class="icon">📸</div>
            <div class="text">${photo.caption}</div>
          </div>`;
      }
      grid.appendChild(item);
    });
  </script>
</body>
</html>
