<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Photo Gallery</title>
  <link rel="stylesheet" href="../css/styles.css">
  <style>
    body { background: var(--midnight); }
    .gallery-page { padding: 100px 20px 60px; max-width: 900px; margin: 0 auto; text-align: center; }

    .carousel {
      position: relative; width: 100%; aspect-ratio: 3/4; max-height: 70vh;
      border-radius: 24px; overflow: hidden;
      border: 2px solid rgba(212,168,83,.25); box-shadow: 0 20px 80px rgba(212,168,83,.15);
      touch-action: pan-y; user-select: none;
    }
    .card {
      position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
      opacity: 0; transform: scale(0.92) translateX(60px);
      transition: opacity .5s ease, transform .5s cubic-bezier(.23,1,.32,1);
      pointer-events: none; will-change: transform, opacity;
    }
    .card.active { opacity: 1; transform: scale(1) translateX(0); pointer-events: auto; }
    .card.exit-left { opacity: 0; transform: scale(0.92) translateX(-60px); }
    .card img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .card .placeholder {
      width: 100%; height: 100%; display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 12px;
      background: linear-gradient(145deg, rgba(255,255,255,.06), rgba(255,255,255,.02)); color: var(--lavender);
    }
    .card .placeholder .icon { font-size: 60px; }
    .card .placeholder .text { font-family: 'Dancing Script', cursive; font-size: 18px; }
    .card .caption { display: none; }
    .nav-arrow {
      position: absolute; top: 50%; transform: translateY(-50%);
      width: 48px; height: 48px; border-radius: 50%;
      background: rgba(26,10,30,.7); border: 1px solid rgba(212,168,83,.4);
      color: var(--gold-light); font-size: 20px; cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      transition: all .3s; z-index: 10; backdrop-filter: blur(8px);
    }
    .nav-arrow:hover { background: var(--gold); color: var(--midnight); transform: translateY(-50%) scale(1.1); }
    .nav-arrow.prev { left: 14px; }
    .nav-arrow.next { right: 14px; }
    .carousel-dots { display: flex; gap: 8px; justify-content: center; margin-top: 20px; flex-wrap: wrap; }
    .carousel-dot {
      width: 10px; height: 10px; border-radius: 50%; background: rgba(255,255,255,.2);
      cursor: pointer; transition: all .3s; border: none; padding: 0;
    }
    .carousel-dot.active { background: var(--gold); transform: scale(1.3); box-shadow: 0 0 10px rgba(212,168,83,.5); }
    .carousel-counter { font-family: 'Dancing Script', cursive; font-size: 18px; color: var(--gold-light); margin-top: 12px; }
    @media (prefers-reduced-motion: reduce) { .card { transition: none !important; } .nav-arrow:hover { transform: translateY(-50%) !important; } }
    @media (max-width: 600px) {
      .carousel { border-radius: 16px; }
      .nav-arrow { width: 40px; height: 40px; font-size: 16px; }
      .nav-arrow.prev { left: 8px; } .nav-arrow.next { right: 8px; }
      .card .caption { font-size: 18px; padding: 30px 15px 15px; }
    }
  </style>
</head>
<body>
  <div class="gallery-page">
    <div class="section-header">
      <div class="ornament">✦ ✦ ✦</div>
      <h2>Photo Gallery</h2>
      <p>Swipe through our memories</p>
    </div>
    <div class="carousel" id="carousel">
      <button class="nav-arrow prev" id="prevBtn" aria-label="Previous photo">◀</button>
      <button class="nav-arrow next" id="nextBtn" aria-label="Next photo">▶</button>
    </div>
    <div class="carousel-dots" id="carouselDots"></div>
    <div class="carousel-counter" id="carouselCounter"></div>
  </div>

  <script src="../js/engine.js"></script>
  <script>
    // ══════════════════════════════════════════════════
    //  PASTE YOUR IMAGEBB DIRECT LINK URLs BELOW
    //  Upload at https://imgbb.com → copy "Direct link"
    // ══════════════════════════════════════════════════
    const photos = [
      { url: 'https://i.ibb.co/ycNjcMbV/IMG-20260902-WA0023.jpg'},
      { url: 'https://i.ibb.co/99DZY8Gy/IMG-20260902-WA0028.jpg',  },
      { url: 'https://i.ibb.co/HLq9CQHC/IMG-20260902-WA0029.jpg',  },
      { url: 'https://i.ibb.co/S85XYTY/IMG-20260902-WA0030.jpg',  },
      { url: 'https://i.ibb.co/rGt2CRQK/IMG-20260902-WA0031.jpg', },
      { url: 'https://i.ibb.co/KjD5xkDY/IMG-20260902-WA0032.jpg', },
      { url: 'https://i.ibb.co/mrXF1r4V/IMG-20260902-WA0033.jpg', },
      { url: 'https://i.ibb.co/wFZ5XPfZ/IMG-20260902-WA0034.jpg', },
      { url: 'https://i.ibb.co/vvrVg6Vg/IMG-20260902-WA0038.jpg', },
      { url: 'https://i.ibb.co/HfD6hkfv/IMG-20260902-WA0040.jpg', },
    ];

    const carousel = document.getElementById('carousel');
    const dotsEl = document.getElementById('carouselDots');
    const counterEl = document.getElementById('carouselCounter');
    let idx = 0, startX = 0, deltaX = 0, swiping = false;

    photos.forEach((photo, i) => {
      const card = document.createElement('div');
      card.className = 'card' + (i === 0 ? ' active' : '');
      card.innerHTML = photo.url
        ? `<img src="${photo.url}" alt="${photo.caption}" loading="${i < 2 ? 'eager' : 'lazy'}"><div class="caption">${photo.caption}</div>`
        : `<div class="placeholder"><div class="icon">📸</div><div class="text">${photo.caption}</div></div>`;
      carousel.insertBefore(card, document.getElementById('nextBtn'));
    });

    photos.forEach((_, i) => {
      const dot = document.createElement('button');
      dot.className = 'carousel-dot' + (i === 0 ? ' active' : '');
      dot.setAttribute('aria-label', `Go to photo ${i + 1}`);
      dot.addEventListener('click', () => goTo(i));
      dotsEl.appendChild(dot);
    });

    function goTo(newIdx, direction) {
      if (newIdx === idx || newIdx < 0 || newIdx >= photos.length) return;
      const cards = document.querySelectorAll('.card');
      const oldCard = cards[idx], newCard = cards[newIdx];
      const goingRight = direction !== undefined ? direction === 'right' : newIdx > idx;
      oldCard.classList.remove('active');
      oldCard.classList.add(goingRight ? 'exit-left' : '');
      if (!goingRight) oldCard.style.transform = 'scale(0.92) translateX(60px)';
      newCard.classList.remove('exit-left');
      newCard.style.transform = goingRight ? 'translateX(60px)' : 'translateX(-60px)';
      void newCard.offsetWidth;
      newCard.classList.add('active');
      newCard.style.transform = '';
      setTimeout(() => { oldCard.classList.remove('exit-left'); oldCard.style.transform = ''; }, 500);
      idx = newIdx;
      document.querySelectorAll('.carousel-dot').forEach((d, i) => d.classList.toggle('active', i === idx));
      counterEl.textContent = `${idx + 1} / ${photos.length}`;
    }

    document.getElementById('prevBtn').addEventListener('click', () => goTo(idx > 0 ? idx - 1 : photos.length - 1, 'left'));
    document.getElementById('nextBtn').addEventListener('click', () => goTo(idx < photos.length - 1 ? idx + 1 : 0, 'right'));
    document.addEventListener('keydown', e => {
      if (e.key === 'ArrowLeft') goTo(idx > 0 ? idx - 1 : photos.length - 1, 'left');
      if (e.key === 'ArrowRight') goTo(idx < photos.length - 1 ? idx + 1 : 0, 'right');
    });
    carousel.addEventListener('touchstart', e => { startX = e.touches[0].clientX; swiping = true; }, { passive: true });
    carousel.addEventListener('touchmove', e => { if (swiping) deltaX = e.touches[0].clientX - startX; }, { passive: true });
    carousel.addEventListener('touchend', () => {
      if (!swiping) return; swiping = false;
      if (Math.abs(deltaX) > 50) { deltaX < 0 ? goTo(idx < photos.length - 1 ? idx + 1 : 0, 'right') : goTo(idx > 0 ? idx - 1 : photos.length - 1, 'left'); }
      deltaX = 0;
    });
    let mouseDown = false, mouseStartX = 0;
    carousel.addEventListener('mousedown', e => { mouseDown = true; mouseStartX = e.clientX; e.preventDefault(); });
    carousel.addEventListener('mousemove', e => { if (mouseDown) deltaX = e.clientX - mouseStartX; });
    carousel.addEventListener('mouseup', () => {
      if (!mouseDown) return; mouseDown = false;
      if (Math.abs(deltaX) > 50) { deltaX < 0 ? goTo(idx < photos.length - 1 ? idx + 1 : 0, 'right') : goTo(idx > 0 ? idx - 1 : photos.length - 1, 'left'); }
      deltaX = 0;
    });
    carousel.addEventListener('mouseleave', () => { mouseDown = false; deltaX = 0; });
  </script>
</body>
</html>
