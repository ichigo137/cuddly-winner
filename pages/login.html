<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login</title>
  <link rel="stylesheet" href="../css/styles.css">
  <style>
    body { background: var(--midnight); }
    .login-page {
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      min-height: 100vh; padding: 20px;
    }
    .login-card {
      background: linear-gradient(145deg, rgba(255,255,255,.06), rgba(255,255,255,.02));
      border: 1px solid rgba(212,168,83,.2); border-radius: 24px;
      padding: 50px 40px; max-width: 420px; width: 100%; text-align: center;
      backdrop-filter: blur(10px);
    }
    .login-heart { font-size: 60px; margin-bottom: 20px; animation: pulse 2s ease-in-out infinite; }
    .login-title {
      font-family: 'Great Vibes', cursive; font-size: 36px;
      background: linear-gradient(135deg, var(--gold-light), var(--rose));
      -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
      margin-bottom: 8px;
    }
    .login-subtitle { font-family: 'Dancing Script', cursive; font-size: 16px; color: var(--lavender); margin-bottom: 30px; }
    .login-field { margin-bottom: 16px; text-align: left; }
    .login-field label {
      display: block; font-family: 'Dancing Script', cursive; font-size: 14px;
      color: var(--gold-light); margin-bottom: 6px;
    }
    .login-field input {
      width: 100%; padding: 12px 16px;
      background: rgba(255,255,255,.06); border: 1px solid rgba(212,168,83,.2);
      border-radius: 12px; color: var(--blush); font-size: 16px;
      font-family: 'Cormorant Garamond', serif; outline: none; transition: border-color .3s;
    }
    .login-field input:focus { border-color: var(--gold); }
    .login-field input::placeholder { color: rgba(252,228,236,.4); }
    .login-btn {
      width: 100%; padding: 14px; margin-top: 10px;
      background: linear-gradient(135deg, var(--rose-deep), var(--gold));
      border: none; border-radius: 50px; color: #fff;
      font-family: 'Playfair Display', serif; font-size: 18px; font-weight: 700;
      cursor: pointer; letter-spacing: 2px; transition: all .4s;
      box-shadow: 0 8px 30px rgba(201,75,124,.4);
    }
    .login-btn:hover { transform: translateY(-2px); box-shadow: 0 12px 40px rgba(201,75,124,.6); }
    .login-btn:disabled { opacity: .5; cursor: not-allowed; transform: none; }
    .login-error {
      color: #f87171; font-size: 14px; margin-top: 12px;
      font-family: 'Dancing Script', cursive; min-height: 20px;
    }
    .login-success {
      color: #4ade80; font-size: 14px; margin-top: 12px;
      font-family: 'Dancing Script', cursive; min-height: 20px;
    }
  </style>
</head>
<body>
  <div class="login-page">
    <div class="login-card">
      <div class="login-heart">💖</div>
      <div class="login-title">Welcome</div>
      <div class="login-subtitle">Sign in to view the gallery</div>

      <form id="loginForm">
        <div class="login-field">
          <label for="email">Email</label>
          <input type="email" id="email" placeholder="your@email.com" required autocomplete="email">
        </div>
        <div class="login-field">
          <label for="password">Password</label>
          <input type="password" id="password" placeholder="Your password" required autocomplete="current-password">
        </div>
        <button type="submit" class="login-btn" id="loginBtn">Sign In 💕</button>
      </form>

      <div class="login-error" id="loginError"></div>
      <div class="login-success" id="loginSuccess"></div>
    </div>
  </div>

  <!-- Supabase JS client (via CDN) -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  <script>
    // ── Supabase config (anon key is safe to expose in frontend) ──
    const SUPABASE_URL = 'https://zkhmdpknqcylwyqqmtcp.supabase.co';
    const SUPABASE_ANON_KEY = window.__SUPABASE_ANON_KEY || '';

    const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    const form = document.getElementById('loginForm');
    const errorEl = document.getElementById('loginError');
    const successEl = document.getElementById('loginSuccess');
    const loginBtn = document.getElementById('loginBtn');

    // ── Check if already logged in ──
    (async () => {
      const { data: { session } } = await supabase.auth.getSession();
      if (session) {
        // Already logged in — pass token to parent and redirect
        passTokenToParent(session.access_token);
      }
    })();

    // ── Login form submit ──
    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      errorEl.textContent = '';
      successEl.textContent = '';
      loginBtn.disabled = true;
      loginBtn.textContent = 'Signing in...';

      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;

      const { data, error } = await supabase.auth.signInWithPassword({ email, password });

      if (error) {
        errorEl.textContent = error.message;
        loginBtn.disabled = false;
        loginBtn.textContent = 'Sign In 💕';
        return;
      }

      successEl.textContent = 'Signed in! Redirecting...';
      passTokenToParent(data.session.access_token);
    });

    // ── Pass token to parent window (the shell) ──
    function passTokenToParent(token) {
      try {
        parent.window.__AUTH_TOKEN = token;
        // Navigate parent to gallery
        parent.window.location.hash = '#gallery';
        parent.window.location.reload();
      } catch (e) {
        // If not in iframe, just redirect
        window.location.hash = '#gallery';
        window.location.reload();
      }
    }
  </script>
</body>
</html>
